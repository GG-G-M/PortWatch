{% extends "base.html" %}
{% block content %}
<h1>Audit Log</h1>
<div class="card">
  <table>
    <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target IP</th><th>Details</th></tr></thead>
    <tbody>
      {% for l in logs %}
      <tr><td>{{ l.ts }}</td><td>{{ l.username }}</td><td>{{ l.action }}</td><td>{{ l.target_ip }}</td><td>{{ l.details_json }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
